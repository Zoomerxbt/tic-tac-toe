<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Tic Tac Toe</title>
</head>

<body class="font-outfit min-h-screen bg-slate-900 flex flex-col justify-center items-center p-6">

  <section id="menu-screen" class="flex flex-col items-center gap-8 w-full max-w-115">

    <img src="assets/logo.svg" alt="Game logo">


    <div class="flex flex-col items-center rounded-16 gap-6 p-6 w-full bg-slate-800 shadow-[0_-8px_0_0_#10212A_inset]">
      <div class="flex flex-col gap-4 justify-center items-center self-stretch">
        <h3 class="text-slate-300 text-center text-preset-4">Pick player 1's mark</h3>


        <div id="mark-picker" class="flex items-center justify-between w-full rounded-10 p-2 bg-slate-900">
          <button id="pick-x" class="w-1/2 rounded-10 p-3  flex justify-center items-center transition-all"
            aria-label="Choose X">
            <img class="h-8 w-auto" src="./assets/X-mark-option.svg" alt="">
          </button>
          <button id="pick-o" class="w-1/2 rounded-10 p-3 flex justify-center items-center transition-all"
            aria-label="Choose O">
            <img class="h-8 w-auto" src="./assets/O-mark-option.svg" alt="">
          </button>
        </div>

        <p class="text-xs font-bold text-slate-400 tracking-wider uppercase">Remember: X goes first</p>
      </div>
    </div>


    <div class="flex flex-col gap-4 w-full">
      <button id="start-cpu"
        class="w-full py-4 bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold rounded-[15px] shadow-[0_-8px_0_0_#CC8B11_inset] transition-all uppercase tracking-wider">
        New Game (vs CPU)
      </button>
      <button id="start-player"
        class="w-full py-4 bg-teal-400 hover:bg-teal-300 text-slate-900 font-bold rounded-[15px] shadow-[0_-8px_0_0_#118C87_inset] transition-all uppercase tracking-wider">
        New Game (vs player)
      </button>
    </div>

  </section>

  <section id="game-screen" class="hidden grid-cols-1 gap-5 w-full mx-auto md:w-115">


    <div class="flex justify-between items-center w-full">
      <img src="./assets/logo.svg" alt="Game logo">
      <div class="bg-slate-800 flex items-center gap-2 py-2 px-4 rounded-10 shadow-sm">
        <div class="w-4 h-4 bg-slate-300 rounded-sm"></div>
        <p id="turn-indicator" class="text-sm font-bold text-slate-300 tracking-wider">X TURN</p>
      </div>
      <button id="restart-btn" class="bg-slate-300 hover:bg-slate-200 p-3 rounded-10 transition-colors"
        aria-label="Restart game">
        <img src="./assets/icon-restart.svg" alt="Restart icon" class="w-5 h-5">
      </button>
    </div>


    <div id="game-board" class="grid grid-cols-3 gap-5 w-full aspect-square">
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="0"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="1"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="2"></button>

      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="3"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="4"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="5"></button>

      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="6"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="7"></button>
      <button
        class="grid-cell aspect-square w-full bg-slate-800 hover:bg-slate-700 rounded-10 text-white font-bold transition-colors text-2xl"
        data-index="8"></button>
    </div>


    <div class="grid grid-cols-3 gap-5 text-center w-full">
      <div class="bg-teal-400 rounded-10 py-3 px-5 text-slate-900">
        <p class="text-xs font-bold uppercase tracking-wide opacity-80">X (You)</p>
        <p id="score-x" class="text-xl font-black mt-1">0</p>
      </div>
      <div class="bg-slate-300 rounded-10 py-3 px-5 text-slate-900">
        <p class="text-xs font-bold uppercase tracking-wide opacity-80">Ties</p>
        <p id="score-tie" class="text-xl font-black mt-1">0</p>
      </div>
      <div class="bg-amber-400 rounded-10 py-3 px-5 text-slate-900">
        <p class="text-xs font-bold uppercase tracking-wide opacity-80">O (CPU)</p>
        <p id="score-o" class="text-xl font-black mt-1">0</p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>

</html>
